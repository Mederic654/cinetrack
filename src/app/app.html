<header class="app-header">
  <div class="header-inner">
    <a routerLink="/tracks" class="brand">
      <span class="brand-icon">♪</span>
      <h1>CinéTrack</h1>
    </a>

    <nav class="main-nav">
      <a routerLink="/tracks" routerLinkActive="active">Catalogue</a>
      @if (auth.isLoggedIn()) {
        <a routerLink="/tracks/new" routerLinkActive="active">Ajouter</a>
        <a routerLink="/favorites" routerLinkActive="active">Favoris</a>
      }
    </nav>

    <div class="auth-panel">
      @if (auth.isLoggedIn()) {
        <span class="user-chip">
          <span class="avatar">{{ (auth.user()?.name || '?').charAt(0) }}</span>
          <span>{{ auth.user()?.name || 'Connecté' }}</span>
        </span>
        <button type="button" class="btn btn-ghost" (click)="auth.logout()">Déconnexion</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="btn btn-primary">Se connecter</a>
      }
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>
