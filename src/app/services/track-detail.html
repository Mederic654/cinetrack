<section class="detail" aria-live="polite">
  @if (track(); as t) {
    <div class="detail-card">
      <div class="cover">
        <img [src]="t.coverUrl" [alt]="t.title" />
      </div>
      <div class="info">
        <p class="eyebrow">{{ t.genre }} · {{ t.year }}</p>
        <h2>{{ t.title }}</h2>
        <p class="artist">{{ t.artist }}</p>
        <p class="album">{{ t.album }}</p>

        <dl class="meta">
          <div>
            <dt>Note</dt>
            <dd>
              <span class="rating">{{ t.rating }}<small>/10</small></span>
            </dd>
          </div>
          <div>
            <dt>Favori</dt>
            <dd>{{ t.favorite ? '⭐ Oui' : '— Non' }}</dd>
          </div>
        </dl>

        @if (auth.isLoggedIn()) {
          <div class="actions">
            <a class="btn btn-primary" [routerLink]="['/tracks', id(), 'edit']">Modifier</a>
            <button type="button" class="btn btn-danger" (click)="onDelete()">Supprimer</button>
          </div>
        }
      </div>
    </div>
  } @else {
    <div class="loading">
      <div class="spinner"></div>
      <p>Chargement…</p>
    </div>
  }
</section>
