<div class="search-page">
  <header class="search-hero">
    <h2>Catalogue</h2>
    <p>Explorez et retrouvez vos morceaux favoris.</p>
  </header>

  <label class="search">
    <span class="search-icon" aria-hidden="true">⌕</span>
    <input
      type="search"
      placeholder="Rechercher un titre ou un artiste…"
      [value]="term()"
      (input)="term.set($any($event.target).value)"
    />
  </label>

  <app-track-list [tracks]="results()" (trackSelected)="openTrack($event)" />
</div>
